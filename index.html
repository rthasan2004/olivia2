<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Olivia Idea – Your Lifestyle Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c28a1c;--gold-d:#a8730f;--cream:#fbf4e6;--paper:#fffdf9;--ink:#1d1a16;--muted:#6f665b;--line:#eadfca;--leaf:#4f6b2a;--dark:#161616;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.2;margin:0;font-weight:700}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
:is(a,button,input):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{background:var(--dark);color:#fff;font-size:13px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:9px;padding-bottom:9px}
.top .tg{opacity:.85}
.socs{display:flex;gap:12px;align-items:center}
.socs a,.socs button{color:#fff;background:none;border:0;padding:0;cursor:pointer;font:700 12px/1 "DM Sans",sans-serif}
.head{background:var(--paper);border-bottom:1px solid var(--line)}
.head .wrap{display:flex;align-items:stretch;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;padding:14px 0}
.logo svg{width:54px;height:42px}
.logo b{display:block;font:700 34px/1 "Playfair Display",serif}
.logo b i{font-style:normal;color:var(--gold)}
.logo small{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:flex;margin-left:auto}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 22px;font:500 15px "DM Sans",sans-serif;color:var(--ink);cursor:pointer;transition:background .3s,color .3s}
.nav button:hover{background:var(--cream)}
.nav button[aria-current="true"]{background:var(--gold);color:#fff}
.sbox{display:flex;align-self:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.sbox input{border:0;padding:10px 16px;font-size:15px;width:200px;background:none}
.sbox button{background:var(--gold);color:#fff;border:0;padding:0 14px;cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding-top:16px;padding-bottom:20px}
.slider{position:relative;height:360px;border-radius:14px;overflow:hidden;background:var(--dark);color:#fff}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 70px;background-size:cover;background-position:center;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
.slide.on{opacity:1;visibility:visible}
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.25) 70%,rgba(0,0,0,.1))}
.slide>*{position:relative;max-width:520px}
.slide .tagc{align-self:flex-start;border:1.5px solid var(--gold);color:#fff;border-radius:999px;padding:3px 16px;font-size:14px}
.slide h2{font-size:clamp(30px,5vw,50px)}
.slide h2 span{color:#f3c76a}
.slide p{margin:0;font-size:18px;opacity:.95}
.btn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--gold);color:#fff;border-radius:999px;padding:11px 26px;font-weight:700;border:0;cursor:pointer;transition:transform .25s,background .25s}
.btn:hover{background:var(--gold-d);transform:translateY(-2px)}
.arr{position:absolute;top:50%;translate:0 -50%;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1.5px solid rgba(255,255,255,.5);cursor:pointer;z-index:2;font-size:20px}
.arr.l{left:14px}.arr.r{right:14px}
.dots{position:absolute;left:70px;bottom:16px;display:flex;gap:8px;z-index:2}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:#fff;opacity:.55;padding:0;cursor:pointer}
.dots button.on{background:var(--gold);opacity:1}
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--cream);border-radius:12px;margin:16px 0;padding:14px 0}
.strip a{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-right:1px solid var(--line);padding:4px 8px;transition:transform .3s}
.strip a:last-child{border:0}
.strip a:hover{transform:translateY(-3px)}
.strip b{font-weight:700}.strip small{color:var(--muted);font-size:13px}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh h2{font-size:21px;display:flex;gap:8px;align-items:center}
.sh a{font-size:14px;font-weight:500}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(80,60,20,.07)}
.pic{aspect-ratio:16/10;background-size:cover;background-position:center;position:relative}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card .in{padding:12px 14px 14px}
.chip{display:inline-block;background:var(--cream);color:var(--gold-d);font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;margin-bottom:4px}
.card h3{font-size:19px}
.card p{margin:6px 0 8px;color:var(--muted);font-size:14.5px}
.meta{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.more{display:block;margin:24px auto 0;border:1.5px solid var(--gold);background:none;color:var(--gold-d);border-radius:999px;padding:10px 30px;font-weight:700;cursor:pointer}
.ttl{display:flex;align-items:center;gap:16px;margin:4px 0 18px}
.ttl span{flex:1;height:1px;background:var(--gold)}
.ttl h2{font-size:26px}
.side>*{margin-bottom:18px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.box h3{font-size:22px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.pop{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.pop:first-of-type{border:0}
.pop .th{width:92px;height:62px;border-radius:8px;background-size:cover;background-position:center;flex:none;overflow:hidden;position:relative}
.pop .th img{width:100%;height:100%;object-fit:cover}
.pop b{display:block;font:700 15px/1.3 "Playfair Display",serif}
.pop small{color:var(--muted)}
.news{background:var(--cream)}
.news p{margin:0 0 10px;color:var(--muted)}
.news input{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;font-size:15px;margin-bottom:10px;background:#fff}
.news .btn{width:100%;justify-content:center;border-radius:10px}
.news .msg{font-size:14px;margin-top:8px;color:var(--leaf)}
.brandc{background:var(--dark);color:#fff;border-radius:12px;padding:24px 20px;font:italic 600 26px/1.3 "Playfair Display",serif}
.brandc span{color:#f3c76a}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.back{display:inline-block;margin:6px 0 14px;color:var(--muted)}
article .pic{aspect-ratio:16/8;border-radius:14px;overflow:hidden;margin-bottom:18px}
article h1{font-size:clamp(30px,5vw,44px);margin-bottom:8px}
.prose{max-width:38em;padding-bottom:24px;font-size:17px}.prose p{margin:0 0 1.1em}
.adslot{display:flex;justify-content:center;max-width:100%;overflow:hidden;margin:14px auto}
.adslot:empty{display:none;margin:0}
.adslot iframe{border:0;max-width:100%;display:block}
footer{background:var(--dark);color:#d8d2c6;margin-top:30px;padding:30px 0;text-align:center;font-size:14px}
footer b{font:700 28px "Playfair Display",serif;color:#fff;display:block}footer b i{font-style:normal;color:#f3c76a}
@media(max-width:1000px){.main{grid-template-columns:1fr}.secs,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{padding:10px 14px}}
@media(max-width:640px){.top .tg{display:none}.head .wrap{gap:8px}.nav{margin:0;width:100%;justify-content:space-between}.nav button{flex:1;padding:8px 4px;font-size:13px}.sbox{width:100%}.sbox input{flex:1;width:auto}.slider{height:330px}.slide{padding:0 22px}.arr{display:none}.dots{left:22px}.secs,.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr);row-gap:10px}.strip a:nth-child(2){border:0}.logo b{font-size:28px}}

@keyframes rise{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,138,28,.55)}60%{box-shadow:0 0 0 14px rgba(194,138,28,0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.logo{animation:drop .9s backwards}
.nav button{animation:drop .8s backwards}
.nav button:nth-child(1){animation-delay:.3s}.nav button:nth-child(2){animation-delay:.5s}.nav button:nth-child(3){animation-delay:.7s}.nav button:nth-child(4){animation-delay:.9s}
.sbox{animation:rise 1s .6s backwards}
.socs>*{animation:pop .6s backwards}.socs>*:nth-child(2){animation-delay:.2s}.socs>*:nth-child(3){animation-delay:.4s}.socs>*:nth-child(4){animation-delay:.6s}
.slide.on h2{animation:rise 1.1s .15s cubic-bezier(.2,.7,.2,1) backwards}
.slide.on p{animation:rise 1.1s .45s cubic-bezier(.2,.7,.2,1) backwards}
.slide.on .btn{animation:rise 1.1s .75s cubic-bezier(.2,.7,.2,1) backwards,pulse 2.6s 2.2s infinite}
article{animation:rise .8s ease-out backwards}
.ttl span{transform:scaleX(0);animation:grow 1.4s .3s ease-out forwards}
.js .rv{opacity:0;translate:0 80px;transition:opacity .9s ease,translate 1s cubic-bezier(.2,.7,.2,1),scale .3s,box-shadow .3s}
.js .rv.in{opacity:1;translate:0 0}
.card.in{animation:bob 5s ease-in-out infinite}
.card.in:nth-child(2n){animation-duration:6s;animation-delay:-1.5s}
.card.in:nth-child(3n){animation-duration:4.6s;animation-delay:-3s}
.card:hover{animation-play-state:paused;scale:1.03;box-shadow:0 14px 28px rgba(80,60,20,.2)}
.card:hover .pic img{transform:scale(1.08)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;translate:none}.ttl span{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 004 0V3M9 3v18M17 21V3c-2.5 1-4 4-4 8h4"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-4.8-8-10.5A4.5 4.5 0 0112 7a4.5 4.5 0 018 2.5C20 15.2 12 20 12 20z"/></symbol>
<symbol id="i-sofa" viewBox="0 0 24 24"><path d="M5 11V8a3 3 0 013-3h8a3 3 0 013 3v3M2 13a2 2 0 014 0v2h12v-2a2 2 0 014 0v5H2zM5 18v2M19 18v2"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
</defs></svg>

<!--
AdSterra ad codes are pasted in the Admin panel (/admin), not in this file.
Home page: top, middle, native, bottom banners + Social Bar + Popunder.
Recipes / Health / Home Decor / post pages: top, native and bottom banners only.
-->

<div class="top"><div class="wrap">
  <div><span id="date"></span> <span class="tg">&nbsp;|&nbsp; Live Better • Feel Healthier • Live Stylish</span></div>
  <div class="socs"><a href="#" aria-label="Facebook">f</a><a href="#" aria-label="YouTube">YT</a><a href="#" aria-label="Pinterest">P</a><a href="#" aria-label="Instagram">IG</a></div>
</div></div>
<header class="head"><div class="wrap">
  <a class="logo" href="./" aria-label="Olivia Idea home">
    <svg viewBox="0 0 54 42" aria-hidden="true"><path d="M5 22L27 4l22 18M11 20v20h32V20" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 36c4-12 14-16 24-14-6 3-8 8-9 14z" fill="#c28a1c"/><rect x="28" y="24" width="5" height="5" fill="#161616"/><rect x="34" y="24" width="5" height="5" fill="#161616"/><rect x="28" y="30" width="5" height="5" fill="#161616"/><rect x="34" y="30" width="5" height="5" fill="#161616"/></svg>
    <span><b>Olivia <i>Idea</i></b><small>Your Lifestyle Companion</small></span>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="sbox"><input id="q" type="search" placeholder="Search here…" aria-label="Search"><button id="sb" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button></div>
</div></header>
<div class="wrap"><div class="adslot" data-ad="ad-top"></div></div>
<div class="wrap main">
  <main id="app"><div class="empty">Loading…</div></main>
  <aside class="side" id="side"></aside>
</div>
<div class="wrap"><div class="adslot" data-ad="ad-native"></div><div class="adslot" data-ad="ad-bottom"></div></div>
<footer><b>Olivia <i>Idea</i></b>Your Lifestyle Companion<br>© Olivia Idea. All rights reserved.</footer>

<script>
var P=[],app=document.getElementById("app"),shown=9,STEP=9,q="",slideTimer=null;
var Q=new URLSearchParams(location.search);
var CP=Q.get("p"),filter=Q.get("c")||"All",isHome=!CP&&filter==="All";
var CATS=[["Recipes","Cook with Love","fork"],["Health","Stay Healthy","heart"],["Home Decor","Decorate Smart","sofa"]];
var SIZES={"ad-top":[728,90],"ad-top-m":[320,50],"ad-mid":[300,250],"ad-bottom":[300,250],"ad-native":["100%",320]};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"post"}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function paras(b){return b.split(/\n{2,}/).map(function(p){return "<p>"+esc(p).replace(/\n/g,"<br>")+"</p>"}).join("")}
function excerpt(b){var t=b.split(/\n{2,}/)[0];return t.length>110?t.slice(0,107)+"…":t}
function ico(n){return '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function bg(p){return p.image?'background-image:url('+esc(p.image)+')':'background:linear-gradient(135deg,'+esc(p.color||"#c28a1c")+',#2b2620)'}
function pic(p){return '<div class="pic" style="background:'+esc(p.color||"#c28a1c")+'33">'+(p.image?'<img src="'+esc(p.image)+'" alt="" loading="lazy">':'')+'</div>'}
function card(p){return '<a class="card rv" href="?p='+p.id+'">'+pic(p)+'<div class="in"><span class="chip">'+esc(p.cat)+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(excerpt(p.body))+'</p><div class="meta">'+fmt(p.date)+'</div></div></a>'}
function href(c){return c==="All"?location.pathname:location.pathname+"?c="+encodeURIComponent(c)}

document.getElementById("date").textContent=new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
var NAV=[["All","Home","home"],["Recipes","Recipes","fork"],["Health","Health","heart"],["Home Decor","Home Decor","sofa"]];
document.getElementById("nav").innerHTML=NAV.map(function(n){return '<button data-c="'+n[0]+'" aria-current="'+(!CP&&n[0]===filter)+'">'+ico(n[2])+n[1]+'</button>'}).join("");
[].forEach.call(document.querySelectorAll("#nav button"),function(b){b.onclick=function(){location.href=href(b.dataset.c)}});
document.getElementById("q").oninput=function(){q=this.value.trim().toLowerCase();shown=STEP;render()};
document.getElementById("sb").onclick=function(){document.getElementById("q").focus()};

/* ---- ads (codes come from the Admin panel) ---- */
var ADS={},ADSOK=false;
function tpl(id){return(ADS[id]||"").trim()}
function mountAds(root){
  if(!ADSOK)return;
  [].forEach.call((root||document).querySelectorAll(".adslot:not([data-done])"),function(el){
    el.dataset.done=1;
    var id=el.dataset.ad;
    if(id==="ad-top"&&window.innerWidth<740&&tpl("ad-top-m"))id="ad-top-m";
    var code=tpl(id);if(!code)return;
    var sz=SIZES[id]||[300,250],f=document.createElement("iframe");
    f.setAttribute("scrolling","no");f.setAttribute("width",sz[0]);f.setAttribute("height",sz[1]);f.title="Advertisement";
    if(sz[0]==="100%")f.style.width="100%";
    f.srcdoc='<!doctype html><html><body style="margin:0;display:flex;justify-content:center">'+code+'</body></html>';
    el.appendChild(f);
  });
}
function runScripts(code){
  var d=document.createElement("div");d.innerHTML=code;
  [].forEach.call(d.querySelectorAll("script"),function(o){
    var s=document.createElement("script");
    [].forEach.call(o.attributes,function(a){s.setAttribute(a.name,a.value)});
    s.text=o.text;document.body.appendChild(s);
  });
}
function globalAds(){if(!isHome)return;["ad-social","ad-popunder"].forEach(function(id){var c=tpl(id);if(c)runScripts(c)})}

/* ---- sidebar ---- */
function side(){
  var pops=P.filter(function(p){return p.pop});if(pops.length<4)pops=P.slice();pops=pops.slice(0,4);
  document.getElementById("side").innerHTML=
   '<div class="box rv"><h3>'+'<span style="color:var(--gold)">★</span> Popular Posts</h3>'+pops.map(function(p){return '<a class="pop" href="?p='+p.id+'"><div class="th" style="background:'+esc(p.color||"#c28a1c")+'44">'+(p.image?'<img src="'+esc(p.image)+'" alt="" loading="lazy">':'')+'</div><div><b>'+esc(p.title)+'</b><small>'+fmt(p.date)+'</small></div></a>'}).join("")+'</div>'
  +'<div class="box news rv"><h3>Subscribe to Our Newsletter</h3><p>Get the latest recipes, health tips and home decor ideas!</p><input id="em" type="email" placeholder="Your Email Address" aria-label="Email address"><button class="btn" id="sub">Subscribe</button><div class="msg" id="smsg"></div></div>'
  +'<div class="brandc rv">Live Better<br>with <span>Olivia Idea</span></div>';
  document.getElementById("sub").onclick=function(){
    var m=document.getElementById("smsg"),e=document.getElementById("em").value;
    m.textContent="Sending…";
    fetch("/api/subscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:e})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(x){m.textContent=x.ok?"Thanks for subscribing!":(x.d.error||"Something went wrong.");if(x.ok)document.getElementById("em").value=""}).catch(function(){m.textContent="Something went wrong."});
  };
}

/* ---- pages ---- */
function slider(){
  var s=P.slice(0,4);if(!s.length)return"";
  return '<div class="slider rv" id="sl">'+s.map(function(p,i){
    var w=p.title.split(" "),k=Math.ceil(w.length/2);
    return '<div class="slide'+(i?'':' on')+'" style="'+bg(p)+'"><span class="tagc">'+esc(p.cat)+'</span><h2>'+esc(w.slice(0,k).join(" "))+' <span>'+esc(w.slice(k).join(" "))+'</span></h2><p>'+esc(excerpt(p.body))+'</p><a class="btn" href="?p='+p.id+'">Read More →</a></div>'}).join("")
  +'<button class="arr l" aria-label="Previous">‹</button><button class="arr r" aria-label="Next">›</button><div class="dots">'+s.map(function(_,i){return '<button class="'+(i?'':'on')+'" aria-label="Slide '+(i+1)+'"></button>'}).join("")+'</div></div>';
}
function startSlider(){
  clearInterval(slideTimer);
  var sl=document.getElementById("sl");if(!sl)return;
  var sl_=sl.querySelectorAll(".slide"),ds=sl.querySelectorAll(".dots button"),i=0;
  function go(n){sl_[i].classList.remove("on");ds[i].classList.remove("on");i=(n+sl_.length)%sl_.length;sl_[i].classList.add("on");ds[i].classList.add("on")}
  sl.querySelector(".l").onclick=function(){go(i-1)};
  sl.querySelector(".r").onclick=function(){go(i+1)};
  [].forEach.call(ds,function(d,n){d.onclick=function(){go(n)}});
  function run(){clearInterval(slideTimer);slideTimer=setInterval(function(){go(i+1)},5000)}
  sl.onmouseenter=function(){clearInterval(slideTimer)};sl.onmouseleave=run;run();
}
function home(){
  document.title="Olivia Idea – Your Lifestyle Companion";
  var h=slider()+'<div class="strip rv">'+[["All","Home","Live Better","home"]].concat(CATS.map(function(c){return[c[0],c[0],c[1],c[2]]})).map(function(c){return '<a href="'+href(c[0])+'">'+ico(c[3])+'<b>'+c[1]+'</b><small>'+c[2]+'</small></a>'}).join("")+'</div>';
  h+='<div class="adslot" data-ad="ad-mid"></div><div class="secs">';
  CATS.forEach(function(c){
    var p=P.filter(function(x){return x.cat===c[0]})[0];if(!p)return;
    h+='<section><div class="sh"><h2>'+ico(c[2])+c[0]+'</h2><a href="'+href(c[0])+'">View All →</a></div>'+card(p)+'</section>';
  });
  app.innerHTML=h+'</div>';
}
function listing(title,list){
  document.title=title+" – Olivia Idea";
  var h='<div class="ttl"><span></span><h2>'+esc(title)+'</h2><span></span></div>';
  if(!list.length)h+='<div class="empty">No posts found.</div>';
  else h+='<div class="grid">'+list.slice(0,shown).map(card).join("")+'</div>'+(list.length>shown?'<button class="more" id="more">Show more</button>':'');
  app.innerHTML=h;
  var m=document.getElementById("more");if(m)m.onclick=function(){shown+=STEP;render()};
}
function post(id){
  var p=P.filter(function(x){return x.id===id})[0];
  if(!p){CP=null;isHome=filter==="All";render();return}
  document.title=p.title+" – Olivia Idea";
  app.innerHTML='<a class="back" href="'+href(p.cat)+'">← '+esc(p.cat)+'</a><article>'+pic(p)+'<span class="chip">'+esc(p.cat)+'</span><h1>'+esc(p.title)+'</h1><div class="meta" style="margin-bottom:14px">'+fmt(p.date)+'</div><div class="prose">'+paras(p.body)+'</div></article>';
}
function render(){
  clearInterval(slideTimer);
  if(CP&&!q)post(CP);
  else if(q)listing('Results for “'+q+'”',P.filter(function(p){return(p.title+" "+p.body).toLowerCase().indexOf(q)>-1}));
  else if(filter==="All")home();
  else listing(filter,P.filter(function(p){return p.cat===filter}));
  mountAds(app);if(isHome&&!q)startSlider();
}
fetch("/api/posts").then(function(r){return r.json()}).then(function(d){return d===null?fetch("content/posts.json").then(function(r){return r.json()}).then(function(s){return s.posts||[]}):d}).then(function(d){
  P=d.map(function(p){p.id=slug(p.title);return p}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  side();render();
}).catch(function(){app.innerHTML='<div class="empty">Could not load posts.</div>'});
fetch("/api/ads").then(function(r){return r.json()}).then(function(a){ADS=a||{}}).catch(function(){}).then(function(){ADSOK=true;mountAds();globalAds()});

/* scroll reveal: items rise from the bottom as they enter the screen */
(function(){
  if(!("IntersectionObserver" in window))return;
  document.documentElement.classList.add("js");
  var io=new IntersectionObserver(function(es){
    var n=0;
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var el=e.target;io.unobserve(el);
      el.style.transitionDelay=(n++*0.14)+"s";
      el.classList.add("in");
      setTimeout(function(){el.style.transitionDelay=""},1800);
    });
  },{threshold:.1,rootMargin:"0px 0px -6% 0px"});
  function scan(){[].forEach.call(document.querySelectorAll(".rv:not([data-o])"),function(el){el.dataset.o=1;io.observe(el)})}
  new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
  scan();
})();
</script>
